[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Le jeu est un seul fichier : pas de cache long dessus, sinon les joueurs
# restent bloqués sur une vieille version après une mise à jour.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/catalogue.json"
  [headers.values]
    Cache-Control = "public, max-age=300"
